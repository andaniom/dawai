version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dawai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: dawai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://dawai:${POSTGRES_PASSWORD:?required}@postgres:5432/dawai?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?required}
    depends_on:
      - postgres

volumes:
  postgres_data:
