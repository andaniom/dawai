services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dawai
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: dawai
    ports:
      - "5432:5432"
    volumes:
      - dawai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawai"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dawai-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://dawai:change_me@postgres:5432/dawai?sslmode=disable"
      JWT_SECRET: "production_secret_change_me"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "dawai-avatars"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_URL_INTERNAL: "http://api:8080"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL_INTERNAL: "http://api:8080"
      AUTH_URL: "http://localhost:3000"
      AUTH_SECRET: "development_auth_secret_change_me"
      AUTH_TRUST_HOST: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/csrf"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  dawai-data:
  dawai-storage:
